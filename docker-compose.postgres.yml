services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prospectus_test
      POSTGRES_USER: prospectus
      POSTGRES_PASSWORD: prospectus
    ports:
      - "${PROSPECTUS_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospectus -d prospectus_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
